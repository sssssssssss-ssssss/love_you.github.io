<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Я люблю тебя</title>
  <style>
    :root {
      --bg-gradient-1: #ff9a9e;
      --bg-gradient-2: #fad0c4;
      --heart-color: #FF247C; 
      --text-color: #E94560;
      --text-light: #FF8E9B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      padding-bottom: constant(safe-area-inset-bottom); 
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Контейнер для сердец - теперь он прозрачный и не мешает кликам */
    .heart-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; /* Сквозь него можно нажимать кнопки */
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      /* Делаем их чуть меньше для мобилок, чтобы не перекрывали текст */
      width: 24px; 
      height: 24px;
      background-color: var(--heart-color);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      opacity: 0; /* Скрыты по умолчанию */
      transform: scale(0); /* И сжаты в точку */
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Магия формы сердца через псевдоэлементы */
    .heart::before, .heart::after {
      content: "";
      background-color: inherit;
      border-radius: 50%;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; right: -50%; }

    /* НОВАЯ АНИМАЦИЯ: Всплеск и падение */
    @keyframes float-path {
      0% { 
        opacity: 0; 
        transform: translate(0, 20px) scale(0) rotate(0deg); 
        animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Пружинистый старт */
      }
      15% { 
        opacity: 1; 
        /* Резко вылетают вверх и разлетаются в стороны */
        transform: translate(-20px, -100px) scale(1.1) rotate(-15deg); 
        animation-timing-function: ease-in; 
      }
      60% { 
        /* Парят в верхней точке */
        transform: translate(30px, -50px) scale(1) rotate(15deg);
        animation-timing-function: ease-out;
      }
      100% { 
        /* Плавно падают вниз и исчезают */
        opacity: 0; 
        transform: translate(100px, 150vh) scale(0.5) rotate(45deg); 
      }
    }

    /* --- ТЕКСТ --- */
    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%; max-width: 800px;
      padding: 20px;
      padding-top: constant(safe-area-inset-top);
      padding-top: env(safe-area-inset-top);
    }

    h1 {
      color: var(--text-color);
      font-size: 4rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      line-height: 1.1;
      margin-bottom: 20px;
      word-wrap: break-word; max-width: 100%;
      opacity: 0; transform: translateY(30px);
      animation: fadeInUp 1s ease forwards 0.5s;
      text-transform: uppercase; letter-spacing: 3px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0; animation: fadeIn 1s ease forwards 1s;
      word-wrap: break-word;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- УПРАВЛЕНИЕ --- */
    .controls-wrapper {
      position: fixed;
      bottom: constant(safe-area-inset-bottom);
      bottom: env(safe-area-inset-bottom);
      left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 0 20px;
      pointer-events: none;
    }

    .control-btn {
      width: 65px; height: 65px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: white; font-size: 24px; cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
      transform: none !important; margin: 0 auto;
    }
    .control-btn:active { transform: scale(0.95); }
    .control-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(233, 69, 96, 0.6); border-color: white; }
    .control-btn.paused { background-color: rgba(200, 200, 200, 0.2); border-color: rgba(255, 255, 255, 0.4); color: #aaa; box-shadow: none; transform: none; }
    
    .volume-container {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 10px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 100%; pointer-events: auto;
    }

    .volume-label { font-size: 10px; text-transform: uppercase; color: rgba(255,255,255,0.8); font-weight: 600; letter-spacing: 1px; }

    input[type=range] {
      cursor: pointer; accent-color: var(--heart-color); width: 140px;
      -webkit-appearance: none; background: rgba(255, 255, 255, 0.2);
      border-radius: 10px; height: 6px; max-width: 100%;
      touch-action: manipulation;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; margin-top: -7px; touch-action: manipulation;
    }

    @media (max-width: 360px) {
      h1 { font-size: 2.2rem; }
      .control-btn { width: 55px; height: 55px; font-size: 20px; }
      input[type=range] { width: 100px; }
      .heart { width: 18px; height: 18px; } 
    }
  </style>
</head>
<body>

  <!-- Контейнер сердец -->
  <div class="heart-container" id="heartsArea"></div>

  <!-- Текст -->
  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <!-- Аудио -->
  <audio id="bgMusic" loop>
    <source src="ksb_song.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
  </audio>

  <!-- Кнопки -->
  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
    </div>
  </div>

  <script>
    const heartsArea = document.getElementById('heartsArea');
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    
    let isPlaying = false;
    let heartInterval = null; // Таймер, который запускает появление сердец

    // --- ГЕНЕРАТОР СЕРДЕЧЕК ---
    function createHeart() {
      if (!isPlaying) return; // Если музыка выключена - ничего не делаем

      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      // Случайная стартовая позиция по горизонтали
      const randomX = Math.random() * 100;
      heart.style.left = randomX + '%';
      
      // Добавляем класс с анимацией
      heart.style.animation = 'float-path 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite';
      
      // Случайная задержка старта анимации, чтобы они не летели стеной
      const delay = Math.random() * 2; 
      heart.style.animationDelay = delay + 's';
      
      heartsArea.appendChild(heart);

      // Удаляем сердце после окончания одного цикла анимации (4 секунды), чтобы не засорять память
      setTimeout(() => {
        heart.remove();
      }, 4000);
    }

    // Функция запуска дождя из сердец
    function startHeartRain() {
      createHeart(); // Создаем первое сразу
      // Потом создаем новые каждые 300-600 мс
      heartInterval = setInterval(createHeart, Math.random() * 300 + 300); 
    }

    // Функция остановки дождя
    function stopHeartRain() {
      clearInterval(heartInterval);
      heartInterval = null;
      // Можно оставить те, что уже в полете, или убрать все
      // heartsArea.innerHTML = ''; 
    }

    // --- ЛОГИКА КНОПКИ И ГРОМКОСТИ ---
    if (bgMusic) {
        bgMusic.volume = volumeSlider.value;
        
        playBtn.addEventListener('click', () => {
          if (!isPlaying) {
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
              playPromise.then(_ => {
                isPlaying = true;
                playBtn.textContent = '⏸';
                playBtn.classList.remove('paused');
                
                // ЗАПУСКАЕМ СЕРДЕЧКИ
                startHeartRain();
              }).catch(error => {
                console.log('Автовоспроизведение заблокировано.', error);
              });
            }
          } else {
            bgMusic.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.add('paused');
            
            // ОСТАНАВЛИВАЕМ СЕРДЕЧКИ (новые не появляются)
            stopHeartRain();
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          bgMusic.volume = parseFloat(e.target.value);
        });
    }
  </script>
</body>
</html>
