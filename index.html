<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Я люблю тебя</title>
  <style>
    :root {
      --pink-1: #FFB6C1;
      --pink-2: #FF69B4;
      --text-color: #E94560;
      --text-light: #FF8E9B;
      --white: #ffffff;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      color: var(--text-color);
      font-size: 4rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      line-height: 1.1;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards 0.5s;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1s;
    }

    @keyframes fadeInUp { 
      to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes fadeIn { 
      to { opacity: 1; } 
    }

    /* --- СЕРДЕЧКИ: теперь на чистом CSS (гарантированно работают) --- */
    .heart {
      position: absolute;
      top: -50px;
      /* Размер сердечка */
      width: 30px;
      height: 30px;
      
      /* Цвет */
      background-color: var(--pink-2);
      
      /* Рисуем сердечко через CSS (два круга + квадрат) */
      clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 70%, 20% 100%, 0% 35%);
      
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      animation: float 6s infinite ease-in-out;
      will-change: transform;
      z-index: 5;
    }

    /* Разные задержки для эффекта «дождя» */
    .heart:nth-child(2) { animation-delay: 1s; }
    .heart:nth-child(3) { animation-delay: 2s; }
    .heart:nth-child(4) { animation-delay: 3s; }
    .heart:nth-child(5) { animation-delay: 4s; }

    @keyframes float {
      0%, 100% { 
        transform: translate(0, -50px) rotate(0deg); 
      }
      50% { 
        /* Чуть смещаем вбок и поднимаем выше для плавного изгиба */
        transform: translate(20px, -100px) rotate(-15deg); 
      }
    }
    /* ------------------------------------------------------------- */

    /* Блок управления (кнопка + громкость) — внизу по центру */
    .controls-wrapper {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .control-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background-color: var(--text-color);
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(233, 69, 96, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .control-btn:hover { 
      transform: scale(1.1); 
      box-shadow: 0 15px 30px rgba(233, 69, 96, 0.6); 
    }
    
    .control-btn.paused { 
      background-color: #ccc; 
      color: #555; 
      box-shadow: none;
    }
    
    .volume-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .volume-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      font-weight: bold;
    }

    input[type=range] {
      cursor: pointer;
      accent-color: var(--pink-2);
      width: 120px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .control-btn { width: 60px; height: 60px; font-size: 20px; }
      input[type=range] { width: 100px; }
      .heart { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

  <!-- Декоративные сердечки (5 штук) -->
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>

  <!-- Основной текст (строго в центре) -->
  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <!-- Аудиофайл -->
  <audio id="bgMusic" loop>
    <source src="ksb_song.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
  </audio>

  <!-- Блок управления (внизу по центру) -->
  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить/Выключить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
    </div>
  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        const playPromise = bgMusic.play();
        
        if (playPromise !== undefined) {
          playPromise
            .then(_ => {
              isPlaying = true;
              playBtn.textContent = '⏸';
              playBtn.classList.remove('paused');
            })
            .catch(error => {
              console.log('Автовоспроизведение заблокировано браузером.', error);
            });
        }
      } else {
        bgMusic.pause();
        isPlaying = false;
        playBtn.textContent = '▶';
        playBtn.classList.add('paused');
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      bgMusic.volume = e.target.value;
    });
  </script>
</body>
</html>
