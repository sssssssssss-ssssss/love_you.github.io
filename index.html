<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Я люблю тебя (PC Version)</title>
  
  <!-- Убираем viewport ограничения, чтобы сайт вел себя как обычное приложение на ПК -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-gradient-1: #ff512f;
      --bg-gradient-2: #dd2476;
      --heart-color: #ffffff; /* Белые сердца на ярком фоне смотрятся круче на ПК */
      --text-color: #fff;
      --shadow-color: rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      /* На ПК используем 100vh вместо dvh, чтобы не было странных отступов сверху */
      min-height: 100vh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* Чтобы при полете сердец не появлялись полосы прокрутки */
      position: relative;
      margin: 0;
    }

    /* Контейнер для сердец - на весь экран */
    .heart-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; /* Важно: клики проходят сквозь сердца к кнопкам */
      z-index: 1;
      overflow: visible; /* Разрешаем вылетать за края для эффекта */
    }

    .heart {
      position: absolute;
      width: 35px; /* Крупнее для ПК, чтобы было видно детали */
      height: 35px;
      background-color: var(--heart-color);
      filter: drop-shadow(0 10px 15px var(--shadow-color));
      opacity: 0;
      transform: scale(0);
      will-change: transform, opacity, top, left;
      pointer-events: none;
    }

    /* Форма сердца */
    .heart::before, .heart::after {
      content: "";
      background-color: inherit;
      border-radius: 50%;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; right: -50%; }

    /* АНИМАЦИЯ ПОД ПК: Взрыв снизу вверх */
    @keyframes pc-float {
      0% { 
        opacity: 0; 
        transform: translate(0, 50px) scale(0) rotate(0deg); 
        animation-timing-function: cubic-bezier(0.17, 0.68, 0.84, 1.41); /* Пружинистый старт */
      }
      20% { 
        opacity: 1; 
        /* Резкий взлет вверх и в стороны */
        transform: translate(-60px, -200px) scale(1.2) rotate(-15deg); 
        animation-timing-function: ease-in; 
      }
      60% { 
        /* Парят в верхней точке */
        transform: translate(40px, -100px) scale(1) rotate(10deg);
        animation-timing-function: ease-out;
      }
      100% { 
        /* Плавно растворяются, улетая далеко за экран */
        opacity: 0; 
        transform: translate(150px, -400px) scale(0.5) rotate(45deg); 
      }
    }

    /* Текст - по центру, поверх всего */
    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 50px;
      max-width: 800px;
    }

    h1 {
      color: var(--text-color);
      font-size: 5rem; /* Огромный заголовок для ПК */
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
      line-height: 1.1;
      margin-bottom: 20px;
      opacity: 0; transform: translateY(50px);
      animation: fadeInUp 1.5s ease forwards 0.3s;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-align: center;
    }

    p.subtitle {
      color: rgba(255,255,255,0.9);
      font-size: 1.5rem;
      margin-top: 10px;
      opacity: 0; animation: fadeIn 1.5s ease forwards 1s;
      word-wrap: break-word;
      text-align: center;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Панель управления - внизу по центру, красиво и удобно для мыши */
    .controls-wrapper {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 20;
      pointer-events: auto;
    }

    .control-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: white; font-size: 32px; cursor: pointer;
      box-shadow: 0 0 30px rgba(221, 36, 118, 0.4);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      user-select: none;
    }
    .control-btn:hover { 
      transform: scale(1.1); 
      border-color: white;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
    }
    .control-btn:active { transform: scale(0.95); }
    
    .volume-container {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 15px; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .volume-label { 
      font-size: 12px; 
      text-transform: uppercase; 
      color: rgba(255,255,255,0.8); 
      font-weight: 700; 
    }

    input[type=range] {
      cursor: pointer; accent-color: white; width: 200px;
      -webkit-appearance: none; background: rgba(255, 255, 255, 0.2);
      border-radius: 10px; height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; margin-top: -9px;
    }
  </style>
</head>
<body>

  <!-- Контейнер сердец -->
  <div class="heart-container" id="heartsArea"></div>

  <!-- Текст -->
  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <!-- Аудио: Используем надежный источник для теста -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Music-Genres-Sample-Pop.mp3" type="audio/mpeg">
  </audio>

  <!-- Кнопки -->
  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.4">
    </div>
  </div>

  <script>
    const heartsArea = document.getElementById('heartsArea');
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    
    let isPlaying = false;
    // Для ПК ставим больше сердец, так как площадь экрана огромная
    const totalHearts = 100; 
    const hearts = [];

    // 1. Создаем все сердца сразу
    for (let i = 0; i < totalHearts; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heartsArea.appendChild(heart);
      hearts.push(heart);
    }

    // Функция анимации одного сердца
    function animateHeart(heart) {
      if (!isPlaying) {
        heart.style.opacity = '0';
        heart.style.transform = 'scale(0)';
        return;
      }

      // Случайная позиция по горизонтали (в процентах)
      const randomX = Math.random() * 100;
      heart.style.left = randomX + '%';
      
      // Длительность анимации: на ПК делаем полет чуть дольше (4-5 сек), чтобы было красиво
      const duration = Math.random() * 1 + 4; 
      heart.style.animationDuration = duration + 's';
      
      // Случайная задержка старта
      const delay = Math.random() * duration;
      heart.style.animationDelay = delay + 's';
      
      heart.style.opacity = ''; 
      heart.style.transform = '';
      
      // Добавляем саму анимацию
      heart.style.animationName = 'pc-float';
    }

    // Запускаем цикл анимации
    function startHeartRain() {
      hearts.forEach(heart => {
        animateHeart(heart);
      });
      // Перезапускаем каждые 4 секунды для эффекта бесконечности
      setTimeout(startHeartRain, 4000);
    }

    function stopHeartRain() {
      hearts.forEach(heart => {
        heart.style.opacity = '0';
        heart.style.transform = 'scale(0)';
      });
    }

    if (bgMusic) {
        bgMusic.volume = volumeSlider.value;
        
        playBtn.addEventListener('click', () => {
          if (!isPlaying) {
            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
              playPromise
                .then(_ => {
                  isPlaying = true;
                  playBtn.textContent = '⏸';
                  console.log("Музыка запущена!");
                  startHeartRain();
                })
                .catch(error => {
                  // ЭТО ВАЖНО ДЛЯ ПК: Браузер может заблокировать звук
                  console.error("Ошибка воспроизведения:", error);
                  alert("Браузер заблокировал автовоспроизведение. Пожалуйста, нажмите кнопку Play еще раз.");
                });
            }
          } else {
            bgMusic.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            stopHeartRain();
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          bgMusic.volume = parseFloat(e.target.value);
        });
    }
  </script>
</body>
</html>
