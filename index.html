<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Я люблю тебя</title>
  <style>
    :root {
      --bg-gradient-1: #ff9a9e;
      --bg-gradient-2: #fad0c4;
      
      /* Цвет сердечек: яркий, контрастный */
      --heart-color: #FF247C; 
      
      /* Цвета для аккуратной кнопки */
      --btn-gradient-start: #E94560;
      --btn-gradient-end: #C7183B;
      --btn-border: rgba(255, 255, 255, 0.6);
      --btn-hover-glow: rgba(233, 69, 96, 0.4);

      --text-color: #E94560;
      --text-light: #FF8E9B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
      margin: 0;
    }

    /* --- СЕРДЕЧКИ --- */
    .heart-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      background-color: var(--heart-color);
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      animation: float-path 8s linear infinite;
      opacity: 0.9;
      will-change: transform, opacity;
    }

    .heart::before,
    .heart::after {
      content: "";
      background-color: inherit;
      border-radius: 50%;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; right: -50%; }

    @keyframes float-path {
      0% { transform: translate(0, -50px) rotate(0deg); opacity: 0; animation-timing-function: ease-out; }
      10% { opacity: 1; transform: translate(-10px, -100px) rotate(-45deg); }
      50% { transform: translate(150px, 200px) rotate(45deg); animation-timing-function: ease-in-out; }
      100% { transform: translate(300px, 150vh) rotate(180deg); opacity: 0; }
    }

    /* --- ТЕКСТ --- */
    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      color: var(--text-color);
      font-size: 4rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      line-height: 1.1;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards 0.5s;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1s;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- АККУРАТНАЯ КНОПКА (ОБНОВЛЕНО) --- */
    .controls-wrapper {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .control-btn {
      width: 65px; /* Чуть меньше, выглядит изящнее */
      height: 65px;
      border-radius: 50%;
      border: 2px solid var(--btn-border); /* Тонкая белая рамка */
      background: radial-gradient(circle at 30% 30%, rgba(233, 69, 96, 0.9), var(--btn-gradient-end));
      color: white;
      font-size: 22px; /* Иконка чуть меньше */
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3); /* Мягкая тень */
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px); /* Лёгкое размытие фона под кнопкой (эффект стекла) */
    }

    .control-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--btn-hover-glow); /* Красивое свечение */
      border-color: white; /* Рамка становится ярче */
    }
    
    .control-btn.paused { 
      background-color: rgba(200, 200, 200, 0.8);
      border-color: rgba(255, 255, 255, 0.4);
      color: #555;
      box-shadow: none;
      transform: none;
    }
    
    .volume-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .volume-label {
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    input[type=range] {
      cursor: pointer;
      accent-color: var(--heart-color);
      width: 120px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 4px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .control-btn { width: 60px; height: 60px; font-size: 20px; }
      input[type=range] { width: 100px; }
      .heart { width: 20px; height: 20px; } 
    }
  </style>
</head>
<body>

  <!-- Контейнер для сердечек -->
  <div class="heart-container" id="heartsArea"></div>

  <!-- Основной текст -->
  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <!-- Аудиофайл -->
  <audio id="bgMusic" loop>
    <source src="ksb_song.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
  </audio>

  <!-- Блок управления с новой кнопкой -->
  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить/Выключить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
    </div>
  </div>

  <script>
    // --- ГЕНЕРАТОР СЕРДЕЧЕК ---
    const heartsArea = document.getElementById('heartsArea');
    const totalHearts = 20; 

    for (let i = 0; i < totalHearts; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      const randomX = Math.random() * 100;
      heart.style.left = randomX + '%';
      
      const delay = Math.random() * 5; 
      heart.style.animationDelay = delay + 's';
      
      heartsArea.appendChild(heart);
    }

    // --- МУЗЫКА И КНОПКИ ---
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    let isPlaying = false;

    if (bgMusic) {
        playBtn.addEventListener('click', () => {
          if (!isPlaying) {
            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
              playPromise
                .then(_ => {
                  isPlaying = true;
                  playBtn.textContent = '⏸';
                  playBtn.classList.remove('paused');
                })
                .catch(error => {
                  console.log('Автовоспроизведение заблокировано браузером.', error);
                });
            }
          } else {
            bgMusic.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.add('paused');
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          bgMusic.volume = e.target.value;
        });
    } else {
        console.warn("Аудио файл не найден");
    }
  </script>
</body>
</html>
