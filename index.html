<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Я люблю тебя</title>
  <style>
    :root {
      --bg-gradient-1: #ff9a9e;
      --bg-gradient-2: #fad0c4;
      --heart-color: #FF247C; 
      --text-color: #E94560;
      --text-light: #FF8E9B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      padding-bottom: constant(safe-area-inset-bottom); 
      padding-bottom: env(safe-area-inset-bottom);
    }

    .heart-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      width: 20px; /* Чуть меньше, чтобы много влезло на экран */
      height: 20px;
      background-color: var(--heart-color);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      opacity: 0;
      transform: scale(0);
      will-change: transform, opacity, left;
      pointer-events: none;
    }

    .heart::before, .heart::after {
      content: "";
      background-color: inherit;
      border-radius: 50%;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; right: -50%; }

    /* Анимация: резкий старт, плавное падение */
    @keyframes float-path {
      0% { 
        opacity: 0; 
        transform: translate(0, 20px) scale(0) rotate(0deg); 
        animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      15% { 
        opacity: 1; 
        transform: translate(-15px, -80px) scale(1.2) rotate(-10deg); 
        animation-timing-function: ease-in; 
      }
      60% { 
        transform: translate(20px, -40px) scale(1) rotate(10deg);
        animation-timing-function: ease-out;
      }
      100% { 
        opacity: 0; 
        transform: translate(80px, 150vh) scale(0.5) rotate(40deg); 
      }
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%; max-width: 800px;
      padding: 20px;
      padding-top: constant(safe-area-inset-top);
      padding-top: env(safe-area-inset-top);
    }

    h1 {
      color: var(--text-color);
      font-size: 4rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      line-height: 1.1;
      margin-bottom: 20px;
      word-wrap: break-word; max-width: 100%;
      opacity: 0; transform: translateY(30px);
      animation: fadeInUp 1s ease forwards 0.5s;
      text-transform: uppercase; letter-spacing: 3px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0; animation: fadeIn 1s ease forwards 1s;
      word-wrap: break-word;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    .controls-wrapper {
      position: fixed;
      bottom: constant(safe-area-inset-bottom);
      bottom: env(safe-area-inset-bottom);
      left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
      padding: 0 20px;
      pointer-events: none;
    }

    .control-btn {
      width: 65px; height: 65px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: white; font-size: 24px; cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
      transform: none !important; margin: 0 auto;
    }
    .control-btn:active { transform: scale(0.95); }
    .control-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(233, 69, 96, 0.6); border-color: white; }
    .control-btn.paused { background-color: rgba(200, 200, 200, 0.2); border-color: rgba(255, 255, 255, 0.4); color: #aaa; box-shadow: none; transform: none; }
    
    .volume-container {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 10px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 100%; pointer-events: auto;
    }

    .volume-label { font-size: 10px; text-transform: uppercase; color: rgba(255,255,255,0.8); font-weight: 600; letter-spacing: 1px; }

    input[type=range] {
      cursor: pointer; accent-color: var(--heart-color); width: 140px;
      -webkit-appearance: none; background: rgba(255, 255, 255, 0.2);
      border-radius: 10px; height: 6px; max-width: 100%;
      touch-action: manipulation;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; margin-top: -7px; touch-action: manipulation;
    }

    @media (max-width: 360px) {
      h1 { font-size: 2.2rem; }
      .control-btn { width: 55px; height: 55px; font-size: 20px; }
      input[type=range] { width: 100px; }
      .heart { width: 16px; height: 16px; } 
    }
  </style>
</head>
<body>

  <div class="heart-container" id="heartsArea"></div>

  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <audio id="bgMusic" loop>
    <source src="ksb_song.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
  </audio>

  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
    </div>
  </div>

  <script>
    const heartsArea = document.getElementById('heartsArea');
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    
    let isPlaying = false;
    const totalHearts = 70; // МНОГО сердец
    const hearts = [];

    // 1. Создаем все сердца сразу при загрузке (не ждём музыку)
    for (let i = 0; i < totalHearts; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heartsArea.appendChild(heart);
      hearts.push(heart);
    }

    // Функция, которая запускает полёт для конкретного сердца
    function animateHeart(heart) {
      // Если музыка выключена, сердце просто замирает (или можно убрать совсем)
      if (!isPlaying) {
        heart.style.opacity = '0';
        heart.style.transform = 'scale(0)';
        return;
      }

      // Случайная позиция старта
      const randomX = Math.random() * 100;
      heart.style.left = randomX + '%';
      
      // Случайная длительность анимации (чтобы они не летели синхронно)
      const duration = Math.random() * 2 + 3; // от 3 до 5 секунд
      heart.style.animationDuration = duration + 's';
      
      // Случайная задержка старта
      const delay = Math.random() * duration;
      heart.style.animationDelay = delay + 's';
      
      heart.style.opacity = ''; // Сбрасываем в дефолт (видимое)
      heart.style.transform = '';
    }

    // Запускаем бесконечный цикл анимации для всех сердец
    function startHeartRain() {
      hearts.forEach(heart => {
        animateHeart(heart);
      });
      // Перезапускаем каждые 4 секунды, чтобы сердца летали бесконечно
      setTimeout(startHeartRain, 4000);
    }

    function stopHeartRain() {
      // Просто выключаем видимость, пока не нажмут Play снова
      hearts.forEach(heart => {
        heart.style.opacity = '0';
        heart.style.transform = 'scale(0)';
      });
    }

    if (bgMusic) {
        bgMusic.volume = volumeSlider.value;
        
        playBtn.addEventListener('click', () => {
          if (!isPlaying) {
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
              playPromise.then(_ => {
                isPlaying = true;
                playBtn.textContent = '⏸';
                playBtn.classList.remove('paused');
                startHeartRain(); // ЗАПУСКАЕМ ДОЖДЬ
              }).catch(error => {
                console.log('Автовоспроизведение заблокировано.', error);
              });
            }
          } else {
            bgMusic.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.add('paused');
            stopHeartRain(); // ОСТАНАВЛИВАЕМ ДОЖДЬ
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          bgMusic.volume = parseFloat(e.target.value);
        });
    }
  </script>
</body>
</html>
