<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Самое важное для мобильных: запрещает зум и фиксирует масштаб -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Я люблю тебя</title>
  <style>
    :root {
      --bg-gradient-1: #ff9a9e;
      --bg-gradient-2: #fad0c4;
      --heart-color: #FF247C; 
      --btn-gradient-start: #E94560;
      --btn-gradient-end: #C7183B;
      --btn-border: rgba(255, 255, 255, 0.8);
      --text-color: #E94560;
      --text-light: #FF8E9B;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; /* Критически важно: padding не увеличивает ширину элемента */
    }

    body {
      min-height: 100dvh; /* Динамическая высота (учитывает Dynamic Island) */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden; /* ЗАПРЕЩАЕТ ГОРИЗОНТАЛЬНУЮ ПРОКРУТКУ (самое важное!) */
      position: relative;
      margin: 0;
      padding-bottom: constant(safe-area-inset-bottom); 
      padding-bottom: env(safe-area-inset-bottom); /* Отступ под кнопку "Домой" */
    }

    /* --- СЕРДЕЧКИ --- */
    .heart-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden; /* Если вдруг сердечки улетят, они обрежутся, а не растянут экран */
    }

    .heart {
      position: absolute;
      background-color: var(--heart-color);
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      animation: float-path 8s linear infinite;
      opacity: 0.9;
      will-change: transform, opacity;
    }

    .heart::before,
    .heart::after {
      content: "";
      background-color: inherit;
      border-radius: 50%;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; right: -50%; }

    @keyframes float-path {
      0% { transform: translate(0, -50px) rotate(0deg); opacity: 0; animation-timing-function: ease-out; }
      10% { opacity: 1; transform: translate(-10px, -100px) rotate(-45deg); }
      50% { transform: translate(150px, 200px) rotate(45deg); animation-timing-function: ease-in-out; }
      100% { transform: translate(300px, 150vh) rotate(180deg); opacity: 0; }
    }

    /* --- ТЕКСТ --- */
    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      padding-top: constant(safe-area-inset-top);
      padding-top: env(safe-area-inset-top);
    }

    h1 {
      color: var(--text-color);
      font-size: 4rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      line-height: 1.1;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards 0.5s;
      text-transform: uppercase;
      letter-spacing: 3px;
      /* Гарантируем, что текст не вылезет за экран */
      word-wrap: break-word; 
      max-width: 100%;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1s;
      word-wrap: break-word;
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- БЛОК УПРАВЛЕНИЯ (ФИКСАЦИЯ) --- */
    .controls-wrapper {
      position: fixed;
      bottom: constant(safe-area-inset-bottom);
      bottom: env(safe-area-inset-bottom);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center; /* Центрирует кнопку по горизонтали */
      align-items: center;
      flex-direction: column;
      z-index: 100;
      padding: 0 20px;
      pointer-events: none; 
    }

    .control-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid var(--btn-border);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.3);
      /* Убираем любые трансформации, которые могли сдвигать кнопку */
      transform: none !important; 
      margin: 0 auto; /* Дополнительная страховка для центрирования */
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(233, 69, 96, 0.6);
      border-color: white;
    }
    
    .control-btn.paused { 
      background-color: rgba(200, 200, 200, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #aaa;
      box-shadow: none;
      transform: none;
    }
    
    .volume-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 100%; /* Чтобы ползунок не вылезал на очень узких экранах */
    }

    .volume-label {
      font-size: 10px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
      letter-spacing: 1px;
    }

    input[type=range] {
      cursor: pointer;
      accent-color: var(--heart-color);
      width: 140px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      height: 6px;
      max-width: 100%; /* ГЛАВНОЕ: ползунок никогда не будет шире экрана */
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      margin-top: -7px;
    }

    /* Адаптив для очень маленьких экранов (меньше 360px) */
    @media (max-width: 360px) {
      h1 { font-size: 2.2rem; }
      .control-btn { width: 55px; height: 55px; font-size: 20px; }
      input[type=range] { width: 100px; }
      .heart { width: 20px; height: 20px; } 
    }
  </style>
</head>
<body>

  <!-- Контейнер для сердечек -->
  <div class="heart-container" id="heartsArea"></div>

  <!-- Основной текст -->
  <div class="container">
    <h1>Я люблю тебя</h1>
    <p class="subtitle">Ты — самое дорогое, что у меня есть</p>
  </div>

  <!-- Аудиофайл -->
  <audio id="bgMusic" loop>
    <source src="ksb_song.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
  </audio>

  <!-- Блок управления -->
  <div class="controls-wrapper">
    <button id="playBtn" class="control-btn" title="Включить/Выключить музыку">▶</button>
    <div class="volume-container">
      <span class="volume-label">Громкость</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
    </div>
  </div>

  <script>
    // --- ГЕНЕРАТОР СЕРДЕЧЕК ---
    const heartsArea = document.getElementById('heartsArea');
    const totalHearts = 25;

    for (let i = 0; i < totalHearts; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      const randomX = Math.random() * 100;
      heart.style.left = randomX + '%';
      
      const delay = Math.random() * 5; 
      heart.style.animationDelay = delay + 's';
      
      heartsArea.appendChild(heart);
    }

    // --- МУЗЫКА И КНОПКИ ---
    const playBtn = document.getElementById('playBtn');
    const bgMusic = document.getElementById('bgMusic');
    const volumeSlider = document.getElementById('volumeSlider');
    let isPlaying = false;

    if (bgMusic) {
        playBtn.addEventListener('click', () => {
          if (!isPlaying) {
            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
              playPromise
                .then(_ => {
                  isPlaying = true;
                  playBtn.textContent = '⏸';
                  playBtn.classList.remove('paused');
                })
                .catch(error => {
                  console.log('Автовоспроизведение заблокировано браузером.', error);
                });
            }
          } else {
            bgMusic.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.add('paused');
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          bgMusic.volume = e.target.value;
        });
    } else {
        console.warn("Аудио файл не найден");
    }
  </script>
</body>
</html>
